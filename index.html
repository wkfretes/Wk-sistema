<script>
/* ===== CONFIGURAÇÃO DO SUPABASE (preencha com os dados do seu projeto) ===== */
const SB_URL='https://gzuenkdwiwyjqgomlsqh.supabase.co',SB_KEY='sb_publishable_GxMYOzZv3Bq9FSwqwTd3qQ_FMGOTLXi';
const SB_ON=!/COLE_AQUI/.test(SB_URL+SB_KEY);
const PLANOS={mensal:14.99,anual:100}; /* só para EXIBIR: o valor cobrado vem dos secrets PRECO e PRECO_ANUAL no Supabase */
const COBRANCA_ON=true; /* troque para true depois de publicar as funções do Mercado Pago */
const $=s=>document.querySelector(s);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}).replace(/\u00a0/g,' ');
let USR=null,PERF=null,VENCE=null;
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMP_FIX=['DAS','Manutenção','Estacionamento'],PES=['PF','Terreno','Internet','Luz','Casa'],VAR=['Freelancer','Gasolina','Insumos','Alimentação'],FIX=[...EMP_FIX,...PES];
const GN={fix:'Fixo da empresa',var:'Variável da empresa',pes:'Pessoal'};
const CATS=['Faturamento','Freelancer','Alimentação','Gasolina','Insumos',...FIX];
const FIXL=()=>[...new Set([...FIX.filter(c=>!(CFG.rm||[]).includes(c)),...Object.values(FX).flatMap(o=>Object.keys(o).filter(k=>k[0]!=='_'))])];
const VARL=()=>[...new Set([...VAR.filter(c=>c==='Freelancer'||!(CFG.rm||[]).includes(c)),...(CFG.vars||[])])];
const GRP=c=>{if(CFG.g&&CFG.g[c])return CFG.g[c];if(CFG.vars&&CFG.vars.includes(c))return'var';if(PES.includes(c))return'pes';if(EMP_FIX.includes(c))return'fix';for(const o of Object.values(FX))if(o._g&&o._g[c])return o._g[c];return Object.values(FX).some(o=>c in o)?'fix':'var'};
let SB=null,ADM=false,ACS=null;
let M={},FX={},CFG={},ed=null,fsel='',mes='',tab='painel',cli='',col=null,dl=null,FL=null,first=true;
const mn=k=>new Date(k+'-15T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const fd=d=>d.slice(8)+'/'+d.slice(5,7);
const rows=()=>M[mes]||[];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function msg(t){$('#m').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$('#m').textContent='',4500)}
async function save(k){if(!col)return msg('Sem banco de dados: os dados valem só nesta sessão.');try{await col.doc(k).set({rows:M[k]||[],fx:FX[k]||{}})}catch(e){msg('Erro ao salvar. Tente de novo.')}}
async function file(name,data){if(!dl)return msg('Download indisponível neste modo.');try{await dl.save({filename:name,data})}catch(e){msg('Download cancelado.')}}
function calc(r){let f=0,v=0,fe=0,pe=0;r.forEach(x=>{f+=x.e||0;const g=GRP(x.c),s=x.s||0;if(g==='pes')pe+=s;else if(g==='fix')fe+=s;else v+=s});return{f,v,fe,pe,luc:f-v-fe,sob:f-v-fe-pe}}

function faltaCard(c){
 const r=rows(),fx=FX[mes]||{},td=hoje();
 const pf=k=>{const ks=Object.keys(FX).filter(m=>m<mes&&k in FX[m]).sort();return ks.length?+FX[ks.pop()][k]||0:0};
 const it=[];FIXL().forEach(k=>{const p=r.filter(x=>x.c===k&&x.s>0).reduce((a,x)=>a+x.s,0),pv=k in fx?+fx[k]||0:pf(k);if(pv>p)it.push([k,pv-p])});
 const pend=it.reduce((a,x)=>a+x[1],0),falta=pend-c.sob;
 if(!pend)return `<div class="card"><b>Falta para pagar tudo</b><small>Nenhuma despesa fixa ou pessoal pendente. Defina o valor previsto de cada gasto na aba <b>Fixos</b> para eu calcular quanto falta.</small></div>`;
 let est='';
 if(falta>0&&mes===td.slice(0,7)){
  const dd=+td.slice(8),rit=(c.f-c.v)/dd;
  if(rit>0){const n=Math.ceil(falta/rit),t=new Date(td+'T12:00');t.setDate(t.getDate()+n);
   est=`<small>No ritmo atual (média de ${R(rit)} por dia após variáveis), você junta o que falta em cerca de <b>${n} ${n===1?'dia':'dias'}</b> (por volta de ${String(t.getDate()).padStart(2,'0')}/${String(t.getMonth()+1).padStart(2,'0')}). É uma estimativa.</small>`}
  else est='<small>Sem faturamento suficiente neste mês para estimar uma data.</small>'}
 return `<div class="card"><b>Falta para pagar tudo</b>
 <div class="row"><span>Sobra do caixa</span><b class="${c.sob<0?'bad':'ok'}">${R(c.sob)}</b></div>
 <div class="row"><span>Despesas ainda por pagar <small>(fixos e pessoais)</small></span><b class="bad">−${R(pend)}</b></div>
 <div class="row"><b>${falta>0?'Falta juntar':'Sobra depois de pagar tudo'}</b><b class="${falta>0?'bad':'ok'}">${R(Math.abs(falta))}</b></div>
 ${est}
 <details><summary><small>Ver o que falta pagar</small></summary>${it.map(([k,v])=>`<div class="row"><small>${E(k)}</small><span>${R(v)}</span></div>`).join('')}</details></div>`}
function painel(){
 const r=rows(),c=calc(r),fr=r.filter(x=>x.c==='Faturamento'),n=fr.filter(x=>x.q!==0).length,di={},cl={};
 fr.forEach(x=>{di[x.d]=(di[x.d]||0)+x.e;(cl[x.n]=cl[x.n]||[0,0]);cl[x.n][0]+=x.q===0?0:1;cl[x.n][1]+=x.e});
 const ds=Object.keys(di).sort(),mx=Math.max(1,...ds.map(d=>di[d]));
 const top=Object.entries(cl).sort((a,b)=>b[1][1]-a[1][1]).slice(0,8);
 const k=(t,v,s='')=>`<div class="k"><small>${t}</small><b class="${s}">${v}</b></div>`;
 if(!r.length)return '<p>Nenhum dado ainda. Vá em <b>Planilha</b> e importe seu Excel, ou use <b>Lançar</b>.</p>';
 const fp=faltaCard(c);
 return `<div class="g">${k('Faturamento',R(c.f))}${k('Variáveis (empresa)',R(c.v))}${k('Fixos da empresa',R(c.fe))}${k('Lucro da empresa',R(c.luc),c.luc<0?'bad':'ok')}${k('Pessoal (retirada)',R(c.pe))}${k('Sobra do caixa',R(c.sob),c.sob<0?'bad':'ok')}${k('Margem da empresa',c.f?(c.luc/c.f*100).toFixed(1)+'%':'-')}${k('Ticket médio',n?R(c.f/n):'-')}</div>${fp}
 <h3>Faturamento por dia</h3><div class="ch">${ds.map(d=>`<div class="b" title="${R(di[d])}"><i style="height:${Math.round(di[d]/mx*92)}px"></i><span>${d.slice(8)}</span></div>`).join('')}</div>
 <h3>Melhores clientes</h3>${top.map(([a,[q,v]])=>`<div class="row"><span>${E(a)} <small>${q} entregas</small></span><b>${R(v)}</b></div>`).join('')}`}

function dias(){
 const g={};rows().forEach(x=>{(g[x.d]=g[x.d]||[]).push(x)});
 const ds=Object.keys(g).sort().reverse();if(!ds.length)return '<p>Sem dados neste mês.</p>';
 let tf=0,ts=0;
 const h=ds.map(d=>{const l=g[d],f=l.reduce((a,x)=>a+(x.e||0),0),s=l.reduce((a,x)=>a+(GRP(x.c)==='pes'?0:(x.s||0)),0),q=l.filter(x=>x.c==='Faturamento'&&x.q!==0).length;tf+=f;ts+=s;
  return `<details><summary class="row"><span><b>${fd(d)}</b> <small>${q} entregas</small></span><span><b class="ok">${R(f)}</b> <small class="bad">−${R(s)}</small> <b>${R(f-s)}</b></span></summary>${l.map(x=>`<div class="row"><small>${E(x.n)} · ${E(x.c)}</small><span class="${x.e?'ok':'bad'}">${x.e?R(x.e):'−'+R(x.s)}</span></div>`).join('')}</details>`}).join('');
 return `<small>Faturado · despesas da empresa · saldo do dia (gastos pessoais não entram). Toque no dia para ver os lançamentos.</small>${h}<div class="row"><b>Total do mês</b><span><b class="ok">${R(tf)}</b> <small class="bad">−${R(ts)}</small> <b>${R(tf-ts)}</b></span></div>`}
function semanas(){
 const iso=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
 const g={};rows().forEach(x=>{const t=new Date(x.d+'T12:00');t.setDate(t.getDate()-(t.getDay()+6)%7);const k=iso(t);(g[k]=g[k]||[]).push(x)});
 const ks=Object.keys(g).sort();if(!ks.length)return '<p>Sem dados neste mês.</p>';
 const ini=mes+'-01',fim=mes+'-'+String(new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate()).padStart(2,'0');
 let ant=null,tf=0,ts=0;
 const h=ks.map((k,i)=>{const l=g[k],f=l.reduce((a,x)=>a+(x.e||0),0),d=l.reduce((a,x)=>a+(GRP(x.c)==='pes'?0:(x.s||0)),0),q=l.filter(x=>x.c==='Faturamento'&&x.q!==0).length,lu=f-d;
  const e=new Date(k+'T12:00');e.setDate(e.getDate()+6);const a=k<ini?ini:k,b=iso(e)>fim?fim:iso(e);
  let cp='';if(ant!==null&&ant!==0){const p=(lu-ant)/Math.abs(ant)*100;cp=`<small class="${p>=0?'ok':'bad'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}% vs. semana anterior</small>`}
  ant=lu;tf+=f;ts+=d;
  const ds=[...new Set(l.map(x=>x.d))].sort().map(dd=>{const z=l.filter(x=>x.d===dd),zf=z.reduce((a,x)=>a+(x.e||0),0),zs=z.reduce((a,x)=>a+(GRP(x.c)==='pes'?0:(x.s||0)),0);return `<div class="row"><small>${fd(dd)} · ${z.filter(x=>x.c==='Faturamento'&&x.q!==0).length} entregas</small><span>${R(zf)} <small class="bad">−${R(zs)}</small> <b>${R(zf-zs)}</b></span></div>`}).join('');
  return `<details><summary class="row"><span><b>Semana ${i+1}</b> <small>${fd(a)} a ${fd(b)} · ${q} entregas</small><br>${cp}</span><span><small>Faturado ${R(f)}</small><br><small class="bad">Despesas −${R(d)}</small><br><b class="${lu>=0?'ok':'bad'}">Lucro ${R(lu)}</b></span></summary>${ds}</details>`}).reverse().join('');
 return `<small>Semanas de segunda a domingo, cortadas no mês selecionado. Lucro = faturado − despesas da empresa (gastos pessoais não entram). Toque na semana para ver os dias.</small>${h}<div class="row"><b>Total do mês</b><span><b class="ok">${R(tf)}</b> <small class="bad">−${R(ts)}</small> <b>${R(tf-ts)}</b></span></div>`}
function gastos(){
 const r=rows().filter(x=>x.s>0);if(!r.length)return '<p>Sem despesas neste mês.</p>';
 const g={};r.forEach(x=>{g[x.c]=g[x.c]||[0,[]];g[x.c][0]+=x.s;g[x.c][1].push(x)});
 const t=r.reduce((a,x)=>a+x.s,0);
 const gt={fix:0,var:0,pes:0};r.forEach(x=>gt[GRP(x.c)]+=x.s);
 const gh=['var','fix','pes'].map(g=>`<div class="row"><span>${GN[g]} <small>${(gt[g]/t*100).toFixed(0)}%</small></span><b>${R(gt[g])}</b></div>`).join('');
 const fz={};r.filter(x=>x.c==='Freelancer').forEach(x=>{(fz[x.n]=fz[x.n]||[]).push(x)});
 const fl=Object.entries(fz).map(([n,l])=>[n,l,l.reduce((a,x)=>a+x.s,0)]).sort((a,b)=>b[2]-a[2]),ft=fl.reduce((a,x)=>a+x[2],0);
 const fh=fl.map(([n,l,v])=>`<details><summary class="row"><span>${E(n)} <small>${l.length} entregas · média ${R(v/l.length)}</small></span><b>${R(v)}</b></summary>${l.sort((a,b)=>a.d<b.d?1:-1).map(x=>`<div class="row"><small>${fd(x.d)}${(q=>q?' · '+E(q.n)+' · cliente pagou '+R(q.e)+' · lucro '+R(q.e-x.s):'')(x.l&&rows().find(z=>z.l===x.l&&z.e>0))}</small><span>${R(x.s)}</span></div>`).join('')}</details>`).join('');
 return `<div class="k"><small>Total de despesas</small><b class="bad">${R(t)}</b></div><h3>Por grupo</h3>${gh}<h3>Freelancers · ${R(ft)}</h3>${fh||'<small>Nenhum freelancer neste mês.</small>'}<h3>Por categoria · toque para detalhar</h3>`+Object.entries(g).sort((a,b)=>b[1][0]-a[1][0]).map(([c,[v,l]])=>`<details><summary class="row"><span>${E(c)} <small>${GN[GRP(c)]} · ${(v/t*100).toFixed(0)}% · ${l.length} lanç.</small></span><b>${R(v)}</b></summary>${l.sort((a,b)=>a.d<b.d?1:-1).map(x=>`<div class="row"><small>${fd(x.d)} · ${E(x.n)}</small><span>${R(x.s)}</span></div>`).join('')}</details>`).join('')}
function lancar(){
 const h=new Date(),t=h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0');
 const nm=[...new Set(Object.values(M).flat().filter(x=>x.c==='Faturamento').map(x=>x.n))].sort(),fls=[...new Set(Object.values(M).flat().filter(x=>x.c==='Freelancer').map(x=>x.n))].sort();

function plan(){return `<div class="card"><b>Importar planilha Excel</b><small>Lê a aba Movimentacao_Diaria (data, lançamento, categoria, entradas, saídas). Os meses encontrados são substituídos.</small>

async function imp(f){
 if(!f)return;
 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets['Movimentacao_Diaria']||wb.Sheets[wb.SheetNames[0]],n={};
  XLSX.utils.sheet_to_json(ws,{header:1}).forEach(r=>{
   if(typeof r[0]!=='number'||!r[2])return;
   const d=new Date(Date.UTC(1899,11,30)+r[0]*864e5).toISOString().slice(0,10),k=d.slice(0,7);
   (n[k]=n[k]||[]).push({d,n:String(r[1]||''),c:String(r[2]).trim(),e:+r[3]||0,s:+r[4]||0})});
  const ks=Object.keys(n).sort();if(!ks.length)return msg('Nenhum lançamento encontrado.');
  msg('Importando…');for(const k of ks){M[k]=n[k];await save(k)}
  mes=ks[ks.length-1];tab='painel';msg('Importado: '+ks.length+' mês(es).');draw()
 }catch(e){msg('Não consegui ler o arquivo.')}}
const NZ=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const NU=v=>{if(typeof v==='number')return v;const s=String(v??'').replace(/[^\d,.-]/g,'');if(!s)return 0;return parseFloat(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0};
const DT=v=>{
 if(typeof v==='number'&&v>20000&&v<80000)return new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5).toISOString().slice(0,10);
 if(v instanceof Date)return v.toISOString().slice(0,10);
 const s=String(v??'').trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
 if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
 m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''};
async function imp2(f){
 if(!f)return;
 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let best=null;
  for(const nm of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true});
   const hi=a.findIndex(r=>r.some(c=>NZ(c)==='data')&&r.some(c=>/entrad/.test(NZ(c))));
   if(hi>=0&&(!best||NZ(nm).includes('mov')))best={a,hi}}
  let a,hi=0,ci={d:0,n:1,c:2,e:3,s:4};

async function fillModelo(rows,custom){
 const z=await JSZip.loadAsync(TPL,{base64:true});
 const wbx=await z.file('xl/workbook.xml').async('string'),rel=await z.file('xl/_rels/workbook.xml.rels').async('string');
 const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 async function patch(nome,ini,data,cols){
  const sid=(wbx.match(new RegExp('<sheet [^>]*name="'+nome+'"[^>]*>'))||[''])[0].match(/r:id="([^"]+)"/)[1];
  const tg=rel.match(new RegExp('<Relationship [^>]*Id="'+sid+'"[^>]*>'))[0].match(/Target="([^"]+)"/)[1].replace(/^\/?(xl\/)?/,'');
  const path='xl/'+tg;let x=await z.file(path).async('string');
  data.forEach((v,i)=>{
   const r=ini+i,m=x.match(new RegExp('<row r="'+r+'"[^>]*>([\\s\\S]*?)</row>'));if(!m)return;
   const cells={};(m[1].match(/<c r="[A-Z]+\d+"[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g)||[]).forEach(c=>{cells[c.match(/r="([A-Z]+)/)[1]]=c});
   Array.from(cols).forEach((L1,k)=>{const old=cells[L1]||'',s=(old.match(/ s="(\d+)"/)||[])[1],sa=s?' s="'+s+'"':'',val=v[k],ref=L1+r;
    cells[L1]=(val===''||val==null||val===0)?'<c r="'+ref+'"'+sa+'/>':(typeof val==='number'?'<c r="'+ref+'"'+sa+'><v>'+val+'</v></c>':'<c r="'+ref+'"'+sa+' t="inlineStr"><is><t xml:space="preserve">'+esc(val)+'</t></is></c>')});
   const key=Object.keys(cells).sort((a,b)=>a.length-b.length||(a<b?-1:1));
   x=x.replace(m[0],m[0].replace(m[1],key.map(k=>cells[k]).join('')));
  });
  z.file(path,x)}
 await patch('Movimentacao_Diaria',2,rows,'ABCDEOP');
 await patch('Resumo_Categorias',15,custom,'AD');
 return z.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function expModelo(){
 if(!mes||!rows().length)return msg('Escolha um mês com lançamentos.');
 if(rows().length>999)return msg('Mais de 999 lançamentos: use o botão de baixar todos os meses.');
 try{
  const ser=d=>Math.round((Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-Date.UTC(1899,11,30))/864e5);
  const rs=rows().map((x,i)=>[x,i]).sort((a,b)=>a[0].d<b[0].d?-1:a[0].d>b[0].d?1:a[1]-b[1]).map(([x])=>[ser(x.d),x.n,x.c,x.e||0,x.s||0,x.f||'',x.p||0]);
  const kn=['Faturamento',...EMP_FIX,...PES,...VAR],cu=[...new Set(rows().map(x=>x.c))].filter(c=>!kn.includes(c)).slice(0,16).map(c=>[c,{fix:'Fixa (empresa)',pes:'Pessoal',var:'Variável (empresa)'}[GRP(c)]]);
  await file('fechamento_mensal_'+mes+'.xlsx',await fillModelo(rs,cu));msg('Fechamento gerado no seu modelo.')
 }catch(e){msg('Não consegui gerar o modelo. Use o botão de baixar todos os meses.')}}
async function exp(){
 const a=[['DATA','LANÇAMENTO','CATEGORIA','ENTRADAS','SAÍDAS']];
 Object.keys(M).sort().forEach(k=>M[k].forEach(x=>a.push([x.d.split('-').reverse().join('/'),x.n,x.c,x.e||'',x.s||''])));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'Movimentacao_Diaria');
 file('wk-fretes.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}

function draw(keep){if(tab!=='lancar')ed=null;
 const ks=Object.keys(M).sort();
 $('#ms').innerHTML=ks.map(k=>`<option value="${k}" ${k===mes?'selected':''}>${mn(k)}</option>`).join('')||'<option>Sem dados</option>';
 $('#tb').innerHTML=[['painel','Painel'],['dias','Dias'],['semanas','Semanas'],['gastos','Gastos'],['fixos','Fixos'],['entregas','Entregas'],['lancar','Lançar'],['receber','A receber'],['fech','Fechar'],['plan','Planilha'],...(ADM?[['acessos','Acessos']]:[])].map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';draw()">${t}</button>`).join('');
 if(keep&&tab==='lancar')return lst();
 $('#v').innerHTML={painel,dias,semanas,gastos,fixos,entregas,lancar,receber,fech,plan,conta,acessos}[tab]();if(tab==='lancar')lst()}

/* Armazenamento: usa o banco do Claude quando existir; fora dele (GitHub Pages etc.) salva no navegador (localStorage). */
function localDB(){
 const K='wkfretes:meses:',subs=new Set();
 const ids=()=>{const a=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(K))a.push(k.slice(K.length))}}catch(e){}return a};
 const snap=()=>({docs:ids().map(id=>({id,data:()=>{try{return JSON.parse(localStorage.getItem(K+id))}catch(e){return {}}}}))});
 return{
  doc:k=>({set:async v=>{localStorage.setItem(K+k,JSON.stringify(v))}}),
  onSnapshot(ok,err){try{ok(snap())}catch(e){err&&err(e)}}
 }}
function localDL(){return{save:async({filename,data})=>{
 const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}}}
(async()=>{
 let db=null;
 try{const c=window.claude;if(c){try{db=await c.use('db')}catch(e){}try{dl=await c.use('downloads')}catch(e){}}}catch(e){}
 if(!dl)dl=localDL();
 if(SB_ON&&window.supabase){try{await iniciarSB()}catch(e){$('#v').innerHTML='<div class="card"><b>Erro ao iniciar o login</b><small>'+E(e&&e.message||e)+'</small></div>'}return}
 if(SB_ON&&!window.supabase){$('#v').innerHTML='<div class="card"><b>Não foi possível carregar o login</b><small>Verifique sua conexão e recarregue a página.</small></div>';return}
 if(db){col=db.collection('meses')}
 else{try{localStorage.setItem('wkfretes:t','1');localStorage.removeItem('wkfretes:t');col=localDB()}catch(e){msg('Seu navegador bloqueou o armazenamento: os dados não serão salvos.')}}
 if(col)ligar();
 draw()})();
function ligar(){
  col.onSnapshot(s=>{const n={},f={};s.docs.forEach(d=>{const o=d.data()||{};n[d.id]=o.rows||[];f[d.id]=o.fx||{}});M=n;FX=f;CFG={};Object.keys(f).sort().forEach(k=>{if(f[k]&&f[k]._cfg)CFG=f[k]._cfg});
  const ks=Object.keys(n).sort();if(!n[mes])mes=ks[ks.length-1]||'';
  if(first){first=false;if(!ks.length)tab='plan'}draw(true)},()=>msg('Sem conexão com o banco.'));
}

function sbDB(sb,u){return{
 doc:k=>({set:async v=>{const{error}=await sb.from('meses').upsert({user_id:u,mes:k,lancamentos:v.rows||[],fixos:v.fx||{}},{onConflict:'user_id,mes'});if(error)throw error}}),
 async onSnapshot(ok,err){try{const{data,error}=await sb.from('meses').select('mes,lancamentos,fixos').eq('user_id',u);if(error)throw error;
  ok({docs:(data||[]).map(r=>({id:r.mes,data:()=>({rows:r.lancamentos||[],fx:r.fixos||{}})}))})}catch(e){err&&err(e)}}}}

 2:`<b>Crie sua senha</b><label>Senha (mínimo 6 caracteres)<input id="cs" type="password" autocomplete="new-password"></label><label>Repita a senha<input id="cs2" type="password" autocomplete="new-password"></label>`,
 3:`<b>Confirme e finalize</b><div class="row"><small>Nome</small><span>${E(CAD.n)}</span></div><div class="row"><small>E-mail</small><span>${E(CAD.e)}</span></div>${CAD.w?`<div class="row"><small>WhatsApp</small><span>${E(CAD.w)}</span></div>`:''}<label class="chk"><input id="ct" type="checkbox"><span>Concordo em usar meus dados apenas para criar e manter minha conta no sistema.</span></label><small>Depois de criar, você recebe um e-mail para confirmar. O acesso é liberado após a aprovação ou o pagamento do plano.</small>`}[p];

function cadNext(p){

  if(n.length<3)return msg('Informe seu nome completo.');
  if(!/^\S+@\S+\.\S+$/.test(e))return msg('Informe um e-mail válido.');
  CAD.n=n;CAD.e=e;CAD.w=$('#cw').value.trim();return cad(2)}
 if(p===2){const a=$('#cs').value,b=$('#cs2').value;
  if(a.length<6)return msg('A senha precisa ter pelo menos 6 caracteres.');
  if(a!==b)return msg('As senhas não são iguais.');
  CAD.s=a;cad(3)}}

let REC=null,RECERR=false,RF='pendente';
const fdt=d=>d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
function addM(d,n){const t=new Date(d+'T12:00'),dia=t.getDate();t.setDate(1);t.setMonth(t.getMonth()+n);t.setDate(Math.min(dia,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
async function carregarRec(){
 const{data,error}=await SB.from('recebiveis').select('*').order('vencimento');
 RECERR=!!error;REC=error?[]:(data||[]);if(tab==='receber')draw()}
function receber(){
 if(!SB)return '<p>Disponível apenas com login.</p>';
 if(REC===null){carregarRec();return '<p>Carregando…</p>'}
 if(RECERR)return '<div class="card"><b>Falta ativar esta área</b><small>Crie a tabela <b>recebiveis</b> no Supabase (SQL Editor) e recarregue a página.</small></div>';
 const h=hoje(),mk=h.slice(0,7),sm=a=>a.reduce((t,x)=>t+(+x.valor||0),0);
 const pen=REC.filter(x=>x.status==='pendente'),ven=pen.filter(x=>x.vencimento<h),rm=REC.filter(x=>x.status==='pago'&&(x.pago_em||'').slice(0,7)===mk);
 const k=(t,v,c='')=>`<div class="k"><small>${t}</small><b class="${c}">${v}</b></div>`;
 const nm=[...new Set(REC.map(x=>x.cliente))].sort();
 const L=RF==='pago'?REC.filter(x=>x.status==='pago').sort((a,b)=>(b.pago_em||'')<(a.pago_em||'')?-1:1):pen;
 const st=x=>x.status==='pago'?'<span class="bdg p">Recebido</span>':x.vencimento<h?'<span class="bdg v">Vencido</span>':x.vencimento===h?'<span class="bdg h">Vence hoje</span>':'<span class="bdg">Em dia</span>';
 const li=L.map(x=>`<div class="card" style="margin-top:8px"><div class="row" style="border:0;padding:0"><span><b>${E(x.cliente)}</b>${x.parcela?'<small>parcela '+E(x.parcela)+'</small>':''}<small>${E(x.descricao||'')}${x.freelancer?' · fez: '+E(x.freelancer)+(+x.pago_free>0?' (pago '+R(x.pago_free)+')':''):''}</small></span><b>${R(x.valor)}</b></div>
 <div class="row" style="border:0;padding:0"><small>${x.status==='pago'?'Recebido em '+fdt(x.pago_em)+' · '+E(x.forma_pago||x.forma):'Vence em '+fdt(x.vencimento)+' · '+E(x.forma)}</small>${st(x)}</div>
 ${x.status==='pago'?`<button onclick="recDesf('${x.id}')">Desfazer recebimento</button>`:`<button class="pri" onclick="recPg('${x.id}')">Marcar como recebido</button>`}<button onclick="recDel('${x.id}')">Excluir</button></div>`).join('')||'<small>Nada por aqui.</small>';
 return `<div class="g">${k('A receber',R(sm(pen)))}${k('Vencido',R(sm(ven)),ven.length?'bad':'')}${k('Recebido no mês',R(sm(rm)),'ok')}${k('Lançamentos pendentes',pen.length)}</div>
 <small>Para lançar um novo pagamento a prazo, use a aba <b>Lançar</b> → Pagamento: A prazo.</small>
 <h3>Lançamentos</h3><select onchange="RF=this.value;draw()"><option value="pendente" ${RF==='pendente'?'selected':''}>Pendentes</option><option value="pago" ${RF==='pago'?'selected':''}>Recebidos</option></select>${li}
 <small>Dica: o que for lançado como <b>A prazo</b> na aba Lançar entra no Faturamento quando você marcar como recebido.</small>`}
async function addRec(){
 const c=$('#rc').value.trim(),ds=$('#rd').value.trim(),v=+$('#rv').value,n=+$('#rn').value||1,d0=$('#rt').value,f=$('#rf').value;
 if(!c||!(v>0)||!d0)return msg('Preencha cliente, valor e vencimento.');
 const ct=Math.round(v*100),b=Math.floor(ct/n),rows=[];
 for(let i=0;i<n;i++)rows.push({id:uid()+i,cliente:c,descricao:ds,valor:(i===n-1?ct-b*(n-1):b)/100,vencimento:addM(d0,i),forma:f,parcela:n>1?(i+1)+'/'+n:'',status:'pendente'});
 const{error}=await SB.from('recebiveis').insert(rows);
 if(error)return msg('Não foi possível salvar. Confira se a tabela foi criada.');
 msg('Lançado a prazo.');REC=null;draw()}
async function addPrazo(d,n,v){
 if(!SB)return msg('A prazo só funciona com login.');
 const f=$('#xf').value,np=+$('#xn').value||1,d0=$('#xt').value,fn=$('#ff').value.trim(),fp=+$('#fp').value||0;
 if(!d0)return msg('Informe o vencimento.');
 if(fp>0&&!fn)return msg('Informe o nome do freelancer.');
 const ct=Math.round(v*100),b=Math.floor(ct/np),rows=[];
 for(let i=0;i<np;i++)rows.push({id:uid()+i,cliente:n,descricao:'Lançado em '+fdt(d),valor:(i===np-1?ct-b*(np-1):b)/100,vencimento:addM(d0,i),forma:f,parcela:np>1?(i+1)+'/'+np:'',status:'pendente',fat:true,freelancer:fn||null,pago_free:fn&&i===0?fp:0});
 const{error}=await SB.from('recebiveis').insert(rows);
 if(error)return msg('Não foi possível salvar. Rode o SQL novo no Supabase.');
 if(fn&&fp>0&&col){const k=d.slice(0,7);M[k]=[...(M[k]||[]),{d,n:fn,c:'Freelancer',e:0,s:fp}];save(k)}
 cx(1);$('#fw').value='À vista';tp();REC=null;msg('Lançado a prazo. Veja na aba A receber.')}
async function recPg(id){
 const x=REC.find(y=>y.id===id);if(!x||!confirm('Confirmar recebimento de '+R(x.valor)+' de '+x.cliente+' ('+x.forma+')?'))return;
 const{error}=await SB.from('recebiveis').update({status:'pago',pago_em:hoje(),forma_pago:x.forma}).eq('id',id);
 if(error)return msg('Não foi possível atualizar.');
 if(x.fat&&col){const k=hoje().slice(0,7),fn=x.freelancer||'',en={d:hoje(),n:x.cliente,c:'Faturamento',e:+x.valor,s:0,r:id};
  if(fn){en.f=fn;en.p=+x.pago_free||0}
  if(x.parcela&&!x.parcela.startsWith('1/'))en.q=0;
  M[k]=[...(M[k]||[]),en];save(k)}
 msg('Recebimento registrado.');REC=null;draw()}
async function recDesf(id){
 const{error}=await SB.from('recebiveis').update({status:'pendente',pago_em:null,forma_pago:null}).eq('id',id);
 if(error)return msg('Não foi possível atualizar.');
 Object.keys(M).forEach(k=>{if((M[k]||[]).some(y=>y.r===id)){M[k]=M[k].filter(y=>y.r!==id);save(k)}});

async function recDel(id){
 if(!confirm('Excluir este lançamento? Não pode ser desfeito.'))return;
 const{error}=await SB.from('recebiveis').delete().eq('id',id);
 if(error)return msg('Não foi possível excluir.');REC=null;draw()}

function logoSel(inp){
 const f=inp.files[0];if(!f)return;
 if(!f.type.startsWith('image/'))return msg('Escolha um arquivo de imagem.');
 if(f.size>5e6)return msg('Imagem muito grande (máximo 5 MB).');
 const r=new FileReader();
 r.onload=()=>{const im=new Image();
  im.onload=()=>{const mx=200,k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   PERF.logo=c.toDataURL('image/png');const pv=$('#lgp');pv.src=PERF.logo;pv.style.display='';msg('Logo pronta. Toque em Salvar dados.')};
  im.onerror=()=>msg('Não foi possível ler essa imagem.');im.src=r.result};
 r.readAsDataURL(f)}

 if(error)return msg('Não foi possível salvar. Confira se a tabela perfis foi criada.');

async function trocarEmail(){
 const e=$('#ne').value.trim();
 if(!/^\S+@\S+\.\S+$/.test(e))return msg('Informe um e-mail válido.');
 if(e.toLowerCase()===String(USR.email||'').toLowerCase())return msg('Esse já é o seu e-mail.');
 const{error}=await SB.auth.updateUser({email:e},{emailRedirectTo:location.href.split('#')[0].split('?')[0]});
 if(error)return msg('Não foi possível alterar: '+error.message);
 $('#ne').value='';msg('Enviamos um link de confirmação. O e-mail só muda depois que você confirmar.')}
async function trocarSenha(){
 const a=$('#np').value,b=$('#np2').value;
 if(a.length<6)return msg('A senha precisa ter pelo menos 6 caracteres.');
 if(a!==b)return msg('As senhas não são iguais.');
 const{error}=await SB.auth.updateUser({password:a});
 if(error)return msg('Não foi possível alterar a senha: '+error.message);
 $('#np').value='';$('#np2').value='';msg('Senha alterada com sucesso.')}

let SEC='';
function menu(){
 const m=$('#mn');
 if(m.style.display!=='none'){m.style.display='none';return}
 m.innerHTML=`<button onclick="irConta('dados')">🏢 Logo e dados da empresa</button><button onclick="irConta('conta')">👤 Minha conta</button><button onclick="irConta('email')">✉️ Alterar e-mail</button><button onclick="irConta('senha')">🔒 Alterar senha</button><hr><button onclick="tema()">${document.documentElement.dataset.tema==='escuro'?'☀️ Tema claro':'🌙 Tema escuro'}</button><hr><button class="sx" onclick="sair()">Sair</button>`;
 m.style.display=''}
function tema(){const t=document.documentElement.dataset.tema==='escuro'?'claro':'escuro';document.documentElement.setAttribute('data-tema',t);try{localStorage.setItem('tema',t)}catch(e){}$('#mn').style.display='none'}
function irConta(sec){
 $('#mn').style.display='none';SEC=sec;tab='conta';draw();rolar()}
function rolar(){
 if(!SEC)return;const el=$('#s-'+SEC);
 if(el){el.scrollIntoView({behavior:'smooth',block:'start'});SEC=''}}
document.addEventListener('click',e=>{const m=$('#mn');if(m&&!e.target.closest('#mn,#so'))m.style.display='none'});
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
